<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Exelon Data Marketplace</title>
<style>
/* ============================================================
   Exelon Data Product Marketplace — Collibra-style Prototype
   Design system / global styles
   ============================================================ */

:root {
  /* Exelon brand palette (2022 rebrand: indigo + teal→purple gradient) */
  --exelon-navy:      #1b0f48;   /* deep indigo */
  --exelon-navy-2:    #2a1a6b;
  --exelon-blue:      #5b2fd0;   /* primary action (violet-blue) */
  --exelon-blue-dk:   #4824a0;
  --exelon-sky:       #2aa9e0;   /* cyan accent (mid of brand gradient) */
  --exelon-teal:      #16c9ac;   /* teal-green (top of brand mark) */
  --exelon-green:     #16c9ac;   /* success / CTA — teal-green to match brand */
  --exelon-green-dk:  #0f9e86;
  --exelon-purple:    #7b2ff2;   /* violet (bottom of brand mark) */
  --exelon-gold:      #f2a900;

  /* Collibra-style neutrals */
  --ink:        #1a2b3c;
  --ink-soft:   #44586b;
  --muted:      #6b7c8d;
  --line:       #e2e8ef;
  --line-soft:  #eef2f6;
  --bg:         #f4f7fa;
  --surface:    #ffffff;
  --surface-2:  #f8fafc;

  /* status */
  --ok:    #1f9d57;
  --ok-bg: #e6f6ec;
  --warn:  #c77700;
  --warn-bg:#fdf3e2;
  --bad:   #d23b3b;
  --bad-bg:#fbe9e9;
  --info:  #5b2fd0;
  --info-bg:#efeafc;

  --radius:   12px;
  --radius-sm:8px;
  --radius-lg:18px;
  --shadow-sm: 0 1px 2px rgba(12,31,63,.06), 0 1px 3px rgba(12,31,63,.08);
  --shadow:    0 4px 14px rgba(12,31,63,.08);
  --shadow-lg: 0 18px 50px rgba(12,31,63,.18);

  --maxw: 1240px;
  --font: "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--exelon-blue); text-decoration: none; }
a:hover { text-decoration: underline; }
img { max-width: 100%; }
h1,h2,h3,h4 { color: var(--ink); margin: 0 0 .4em; line-height: 1.2; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.center { text-align: center; }

/* ===================== Top App Bar ===================== */
.appbar {
  background: linear-gradient(100deg, var(--exelon-navy) 0%, var(--exelon-navy-2) 55%, var(--exelon-blue-dk) 100%);
  color: #fff;
  position: sticky; top: 0; z-index: 40;
  box-shadow: 0 2px 10px rgba(12,31,63,.25);
}
.appbar-inner {
  max-width: var(--maxw); margin: 0 auto; padding: 0 24px;
  height: 60px; display: flex; align-items: center; gap: 22px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand a { text-decoration: none; display:flex; align-items:center; gap:12px; }
.brand .logo { height: 30px; display: block; }
.brand .divider { width: 1px; height: 26px; background: rgba(255,255,255,.25); }
.brand .product-name {
  color: #fff; font-weight: 600; font-size: 15px; letter-spacing: .2px;
  display:flex; flex-direction:column; line-height:1.1;
}
.brand .product-name small { font-weight: 400; font-size: 11px; color: #aacbe6; }

.appnav { display: flex; align-items: center; gap: 4px; margin-left: 6px; }
.appnav a {
  color: #d7e6f3; font-size: 13.5px; font-weight: 500; padding: 8px 12px;
  border-radius: 8px; text-decoration: none;
}
.appnav a:hover { background: rgba(255,255,255,.10); color: #fff; }
.appnav a.active { background: rgba(255,255,255,.16); color: #fff; }

.appbar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.iconbtn {
  width: 36px; height: 36px; border-radius: 50%; border: none;
  background: rgba(255,255,255,.10); color: #fff; cursor: pointer;
  display: grid; place-items: center; font-size: 16px; position: relative;
}
.iconbtn:hover { background: rgba(255,255,255,.2); }
.iconbtn .dot {
  position: absolute; top: 7px; right: 8px; width: 8px; height: 8px;
  background: var(--exelon-green); border-radius: 50%; border: 2px solid var(--exelon-navy);
}
.avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, var(--exelon-teal), var(--exelon-purple));
  color: #fff; font-weight: 700; font-size: 13px; display: grid; place-items: center;
  cursor: pointer; border: 2px solid rgba(255,255,255,.4);
}
.user-chip { display:flex; align-items:center; gap:9px; cursor:pointer; }
.user-chip .who { line-height:1.1; }
.user-chip .who b { font-size:13px; color:#fff; font-weight:600; }
.user-chip .who small { font-size:11px; color:#aacbe6; display:block; }

/* mini search in appbar */
.appbar-search {
  flex: 1; max-width: 420px; position: relative;
}
.appbar-search input {
  width: 100%; height: 38px; border-radius: 20px; border: none;
  padding: 0 16px 0 40px; font-size: 13.5px; background: rgba(255,255,255,.14);
  color: #fff; outline: none;
}
.appbar-search input::placeholder { color: #bdd6ea; }
.appbar-search input:focus { background: rgba(255,255,255,.22); }
.appbar-search .si { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #bdd6ea; }

/* ===================== Buttons ===================== */
.btn {
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  border: 1px solid transparent; border-radius: 9px; padding: 10px 18px;
  font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  transition: all .15s ease; text-decoration: none; line-height: 1.1;
}
.btn:hover { text-decoration: none; }
.btn-primary { background: var(--exelon-blue); color: #fff; }
.btn-primary:hover { background: var(--exelon-blue-dk); box-shadow: var(--shadow); }
.btn-green { background: var(--exelon-green); color: #fff; }
.btn-green:hover { background: var(--exelon-green-dk); box-shadow: var(--shadow); }
.btn-ghost { background: #fff; color: var(--exelon-blue); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--exelon-blue); background: var(--info-bg); }
.btn-dark { background: var(--exelon-navy); color: #fff; }
.btn-dark:hover { background: var(--exelon-navy-2); }
.btn-sm { padding: 7px 13px; font-size: 13px; }
.btn-lg { padding: 13px 26px; font-size: 15.5px; }
.btn-block { width: 100%; }

/* ===================== Badges & pills ===================== */
.badge {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px;
  font-weight: 700; padding: 4px 10px; border-radius: 30px; letter-spacing: .2px;
}
.badge-certified { background: var(--ok-bg); color: var(--ok); }
.badge-candidate { background: var(--warn-bg); color: var(--warn); }
.badge-pii       { background: var(--bad-bg); color: var(--bad); }
.badge-info      { background: var(--info-bg); color: var(--info); }
.badge-neutral   { background: #eef2f6; color: var(--ink-soft); }
.badge-green     { background: #eef7e2; color: var(--exelon-green-dk); }

.pill {
  display: inline-flex; align-items:center; gap:6px; font-size: 12.5px; font-weight: 500;
  padding: 5px 12px; border-radius: 30px; background: #eef2f6; color: var(--ink-soft);
  text-decoration: none; border: 1px solid transparent;
}
a.pill:hover { background: var(--info-bg); color: var(--exelon-blue); border-color: #cfe3f3; text-decoration: none; }

.tag { font-size: 12px; color: var(--exelon-blue); background: var(--info-bg);
  padding: 3px 10px; border-radius: 6px; font-weight: 500; }

/* ===================== Stars ===================== */
.stars { display: inline-flex; gap: 1px; color: var(--exelon-gold); font-size: 14px; letter-spacing: 1px; }
.stars .empty { color: #d6dde4; }
.rating-line { display: inline-flex; align-items: center; gap: 7px; }
.rating-line b { font-size: 13.5px; }

/* ===================== Cards ===================== */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
}
.card-pad { padding: 22px; }

/* ===================== Footer ===================== */
.footer {
  background: var(--exelon-navy); color: #c8d6e5; margin-top: 60px;
  padding: 34px 0 26px; font-size: 13px;
}
.footer .wrap { display: flex; flex-wrap: wrap; gap: 30px; justify-content: space-between; align-items: center; }
.footer a { color: #9fc6e6; }
.footer .foot-links { display:flex; gap: 22px; flex-wrap: wrap; }
.footer .legal { color: #7f99b3; font-size: 12px; }

/* ===================== Section headers ===================== */
.section { margin: 38px 0; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; gap: 14px; }
.section-head h2 { font-size: 21px; margin: 0; }
.section-head .sub { color: var(--muted); font-size: 13.5px; margin-top: 3px; }
.section-head a.more { font-size: 13.5px; font-weight: 600; white-space: nowrap; }

/* ===================== Product cards (grid) ===================== */
.grid { display: grid; gap: 18px; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }

.pcard {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: var(--shadow-sm); transition: all .16s ease; text-decoration: none; color: inherit;
  position: relative; overflow: hidden;
}
.pcard:hover { box-shadow: var(--shadow-lg); transform: translateY(-3px); border-color: #cfe0ee; text-decoration: none; }
.pcard .pcard-top { display: flex; align-items: flex-start; gap: 12px; }
.pcard .ptype {
  width: 42px; height: 42px; border-radius: 10px; flex: 0 0 auto;
  display: grid; place-items: center; font-size: 20px; color: #fff;
  background: linear-gradient(135deg, var(--exelon-teal), var(--exelon-purple));
}
.pcard .ptype.dataset { background: linear-gradient(135deg, var(--exelon-teal), var(--exelon-purple)); }
.pcard .ptype.report  { background: linear-gradient(135deg, var(--exelon-sky), var(--exelon-teal)); }
.pcard .ptype.api     { background: linear-gradient(135deg, var(--exelon-purple), #b06bf0); }
.pcard h3 { font-size: 16px; margin: 0 0 2px; }
.pcard .pcard-type-label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
.pcard .pdesc { color: var(--ink-soft); font-size: 13px; line-height: 1.45; flex: 1; }
.pcard .pcard-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line-soft); padding-top: 11px; }
.pcard .pcard-meta { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--muted); }
.pcard .pcard-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.pcard .domain-tag { font-size: 11.5px; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 5px; }

/* ===================== Page hero / breadcrumbs ===================== */
.crumbs { font-size: 12.5px; color: var(--muted); padding: 14px 0 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.crumbs a { color: var(--ink-soft); }
.crumbs .sep { color: #c2cdd8; }

/* ===================== Tables ===================== */
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.tbl th {
  text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px;
  color: var(--muted); font-weight: 700; padding: 10px 14px; border-bottom: 2px solid var(--line);
  background: var(--surface-2); position: sticky; top: 0;
}
table.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
table.tbl tr:hover td { background: var(--surface-2); }
table.tbl .colname { font-weight: 600; color: var(--ink); }
table.tbl code, .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 12.5px; color: var(--ink-soft); background: var(--surface-2); padding: 2px 6px; border-radius: 5px; }

/* ===================== DQ / progress bars ===================== */
.bar { height: 8px; border-radius: 6px; background: #eaeef3; overflow: hidden; min-width: 70px; }
.bar > span { display: block; height: 100%; border-radius: 6px; }
.bar .fill-ok  { background: linear-gradient(90deg, var(--ok), #34c977); }
.bar .fill-warn{ background: linear-gradient(90deg, var(--warn), var(--exelon-gold)); }
.bar .fill-bad { background: linear-gradient(90deg, var(--bad), #ef6b6b); }
.dqcell { display: flex; align-items: center; gap: 9px; }
.dqcell b { font-size: 13px; min-width: 38px; }

/* score donut */
.score-ring {
  --val: 96; --col: var(--ok);
  width: 110px; height: 110px; border-radius: 50%;
  background: conic-gradient(var(--col) calc(var(--val) * 1%), #eaeef3 0);
  display: grid; place-items: center; position: relative;
}
.score-ring::before { content:""; position: absolute; inset: 11px; background: #fff; border-radius: 50%; }
.score-ring .score-val { position: relative; text-align: center; }
.score-ring .score-val b { font-size: 26px; color: var(--ink); }
.score-ring .score-val small { display: block; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

/* ===================== Tabs ===================== */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 22px; flex-wrap: wrap; }
.tabs button {
  background: none; border: none; padding: 13px 18px; font-size: 14px; font-weight: 600;
  color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; font-family: inherit;
  margin-bottom: -1px; display: inline-flex; align-items: center; gap: 7px;
}
.tabs button:hover { color: var(--ink); }
.tabs button.active { color: var(--exelon-blue); border-bottom-color: var(--exelon-blue); }
.tabs button .count { background: #eef2f6; color: var(--ink-soft); font-size: 11px; padding: 1px 7px; border-radius: 20px; font-weight: 700; }
.tab-panel { display: none; }
.tab-panel.active { display: block; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ===================== Key/value list ===================== */
.kv { display: grid; grid-template-columns: 1fr; gap: 0; }
.kv .row { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
.kv .row:last-child { border-bottom: none; }
.kv .k { color: var(--muted); font-size: 13px; }
.kv .v { font-weight: 600; text-align: right; font-size: 13.5px; }

/* ===================== Modal ===================== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(12,31,63,.55); backdrop-filter: blur(3px);
  display: none; align-items: flex-start; justify-content: center; z-index: 100; padding: 40px 16px; overflow:auto;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff; border-radius: var(--radius-lg); width: 100%; max-width: 640px;
  box-shadow: var(--shadow-lg); overflow: hidden; animation: pop .2s ease;
}
@keyframes pop { from { opacity: 0; transform: scale(.97) translateY(10px); } to { opacity: 1; transform: none; } }
.modal-head { padding: 22px 26px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.modal-head h3 { font-size: 19px; margin: 0; }
.modal-head .x { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); line-height: 1; }
.modal-body { padding: 24px 26px; max-height: 64vh; overflow: auto; }
.modal-foot { padding: 18px 26px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; background: var(--surface-2); }

/* form */
.field { margin-bottom: 18px; }
.field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--ink); }
.field .hint { font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 3px; }
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px;
  font-size: 14px; font-family: inherit; color: var(--ink); background: #fff;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--exelon-blue); box-shadow: 0 0 0 3px rgba(91,47,208,.18); }
.field textarea { resize: vertical; min-height: 80px; }

/* stepper */
.stepper { display: flex; align-items: center; gap: 0; margin-bottom: 24px; }
.stepper .step { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--muted); }
.stepper .step .num { width: 26px; height: 26px; border-radius: 50%; background: #e9eef3; color: var(--muted); display: grid; place-items: center; font-weight: 700; font-size: 12.5px; }
.stepper .step.active .num { background: var(--exelon-blue); color: #fff; }
.stepper .step.done .num { background: var(--ok); color: #fff; }
.stepper .step.active span, .stepper .step.done span { color: var(--ink); font-weight: 600; }
.stepper .line { flex: 1; height: 2px; background: var(--line); margin: 0 12px; }
.stepper .line.done { background: var(--ok); }

/* ===================== Alerts / callouts ===================== */
.callout { border-radius: 10px; padding: 14px 16px; font-size: 13.5px; display: flex; gap: 11px; align-items: flex-start; }
.callout .ico { font-size: 17px; line-height: 1.2; }
.callout-info { background: var(--info-bg); color: #0a4c78; border: 1px solid #cfe3f3; }
.callout-ok { background: var(--ok-bg); color: #14633a; border: 1px solid #c4e8d2; }
.callout-warn { background: var(--warn-bg); color: #875200; border: 1px solid #f3dcae; }

/* ===================== Layout helpers ===================== */
.split { display: grid; grid-template-columns: 1fr 340px; gap: 26px; align-items: start; }
.flex { display: flex; }
.between { justify-content: space-between; }
.items-center { align-items: center; }
.gap-8 { gap: 8px; } .gap-12 { gap: 12px; } .gap-16 { gap: 16px; } .gap-24 { gap: 24px; }
.wrap-flex { flex-wrap: wrap; }
.mt-0 { margin-top: 0; } .mt-8 { margin-top: 8px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }
.mb-0 { margin-bottom: 0; } .mb-8 { margin-bottom: 8px; } .mb-16 { margin-bottom: 16px; }
.hidden { display: none !important; }

/* sticky right rail */
.rail { position: sticky; top: 80px; }

/* ===================== Asset types & relationships ===================== */
.asset-badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:30px; letter-spacing:.2px; white-space:nowrap; }
.pcard-tool { font-size:10.5px; font-weight:700; color:var(--muted); background:var(--surface-2); border:1px solid var(--line); padding:2px 8px; border-radius:20px; }

.rel-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap:12px; }
.relcard { border:1px solid var(--line); border-radius:11px; padding:13px 14px; background:#fff; box-shadow:var(--shadow-sm); transition:all .14s ease; height:100%; }
a.relcard:hover { box-shadow:var(--shadow); border-color:#cfe0ee; transform:translateY(-2px); }
a.relcard { text-decoration:none; color:inherit; display:block; }
.relcard.nolink { background:var(--surface-2); }
.relcard .rel-name { font-weight:700; font-size:14px; margin:8px 0 3px; }
.relcard .rel-desc { font-size:12px; color:var(--muted); line-height:1.45; }
.relcard .rel-foot { margin-top:9px; font-size:11.5px; color:var(--exelon-blue); font-weight:600; }
.relcard.nolink .rel-foot { color:var(--muted); }
.rel-arrowrow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
.linemini { display:flex; align-items:center; gap:9px; flex-wrap:wrap; background:var(--surface-2); border:1px solid var(--line-soft); border-radius:10px; padding:11px 14px; }
.linemini .lm-node { background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 11px; font-size:12.5px; font-weight:600; }
.linemini .lm-node.self { border-color:var(--exelon-blue); color:var(--exelon-blue); background:var(--info-bg); }
.linemini .lm-arrow { color:#9fb4c8; font-weight:700; }

/* ===================== Report / API "Powered by" + launch ===================== */
.poweredby-card { background:linear-gradient(135deg, var(--exelon-teal), var(--exelon-blue)); color:#fff; }
.launch-card { background:linear-gradient(135deg, #0b7a4b, var(--exelon-green-dk)); color:#fff; padding:22px; }
.launch-card h3 { color:#fff; font-size:17px; margin:0 0 6px; }
.launch-card p { color:#e6f6ec; font-size:13px; margin:0 0 16px; }
.metric-list { list-style:none; margin:0; padding:0; }
.metric-list li { padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px; display:flex; gap:9px; align-items:flex-start; }
.metric-list li:last-child { border-bottom:none; }
.metric-list li::before { content:"▸"; color:var(--exelon-blue); font-weight:700; }
.endpoint { font-family:"SFMono-Regular",Consolas,monospace; font-size:12.5px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:9px 12px; margin-bottom:8px; }

/* ===================== Workflow modals (intake / contract) ===================== */
.modal-lg { max-width: 880px; }
.form-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.chk-row { display:flex; flex-wrap:wrap; gap:14px; padding-top:4px; }
.chk { display:inline-flex; align-items:center; gap:7px; font-size:13.5px; color:var(--ink-soft); font-weight:500; cursor:pointer; }
.chk input { accent-color: var(--exelon-blue); width:15px; height:15px; }

.contract-sec { border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
.contract-sec h4 { margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:#fff; background:var(--exelon-navy); display:inline-block; padding:5px 12px; border-radius:6px; }
.contract-grid { display:grid; grid-template-columns: repeat(3,1fr); gap:16px; }
.contract-grid .cg-label { font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px; }
.cg-list { margin:0; padding-left:16px; font-size:13px; color:var(--ink-soft); }
.cg-list li { padding:2px 0; }
.sign-row { display:grid; grid-template-columns: repeat(5,1fr); gap:10px; margin-top:8px; }
.sign { border:1px dashed var(--line); border-radius:8px; height:54px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:6px; }
.sign span { font-size:11px; color:var(--muted); font-weight:600; }

/* responsive */
@media (max-width: 1080px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
  .split { grid-template-columns: 1fr; }
  .rail { position: static; }
}
@media (max-width: 720px) {
  .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
  .appnav, .appbar-search { display: none; }
  .hero h1 { font-size: 28px !important; }
  .form-grid2, .contract-grid { grid-template-columns: 1fr; }
  .sign-row { grid-template-columns: 1fr 1fr; }
}

/* ---- home ---- */

/* ---- Helper to build star markup ---- */
function starHTML(rating) {
  let full = Math.floor(rating);
  let half = rating - full >= 0.5;
  let s = "";
  for (let i = 0; i < 5; i++) {
    if (i < full) s += "★";
    else if (i === full && half) s += "⯪"; // approximate half
    else s += '<span class="empty">★</span>';
  }
  return `<span class="stars">${s}</span>`;
}

    "description": "Daily Reliability KPIs gives leaders and reliability analysts a once-a-day scorecard of how each operating company is performing against its reliability goals. It compares <b>actual</b> daily and year-to-date results for the industry-standard reliability indices — <b>SAIDI, SAIFI and CAIDI</b> — and customer-interruption measures against their <b>targets</b>, and can be expanded by jurisdiction and cause category (vegetation, transmission &amp; substation, distribution). The dataset refreshes every 24 hours and applies the certified IEEE 2.5 Beta / All-In / Jurisdictional rules so figures are report-ready.",

    "terms": [
      {
        "term": "SAIDI",
        "def": "System Average Interruption Duration Index — average total minutes a customer is without power over a period. Lower is better."
      },
      {
        "term": "SAIFI",
        "def": "System Average Interruption Frequency Index — average number of interruptions a customer experiences. Lower is better."
      },
      {
        "term": "CAIDI",
        "def": "Customer Average Interruption Duration Index — average time to restore an interruption (SAIDI ÷ SAIFI). Lower is better."
      },
      {
        "term": "CI / CMI",
        "def": "Customers Interrupted (count of customers who lost power) and Customer Minutes Interrupted (total customer-minutes of outage)."
      },
      {
        "term": "IEEE 2.5 Beta / All-In / Jurisdictional",
        "def": "The standardized rule sets used to include/exclude major events and define geography when calculating reliability indices."
      },
      {
        "term": "Target vs. Actual (Daily / Cumulative)",
        "def": "Targets are the planned reliability goals; actuals are realized results. Cumulative is year-to-date."
      }

/* ---------- Tabs ---------- */
function initTabs() {
  document.querySelectorAll(".tabs").forEach(tabset => {
    tabset.querySelectorAll("button[data-tab]").forEach(btn => {
      btn.addEventListener("click", () => {
        const target = btn.dataset.tab;
        tabset.querySelectorAll("button[data-tab]").forEach(b => b.classList.toggle("active", b===btn));
        document.querySelectorAll(".tab-panel").forEach(panel => {
          panel.classList.toggle("active", panel.id === "tab-" + target);
        });
        window.scrollTo({ top: document.querySelector('.tabs').offsetTop - 70, behavior: "smooth" });
      });
    });
  });
}

}

/* ---------- Access-request workflow modal ---------- */
let ACCESS_STEP = 1;
function openAccessModal(ctx) {
  ACCESS_STEP = 1;
  if (ctx) applyAccessCtx(ctx);
  document.getElementById("accessModal").classList.add("open");
  renderAccessStep();
}
function applyAccessCtx(c) {
  const set = (id, v) => { const el = document.getElementById(id); if (el && v != null) el.innerHTML = v; };
  set("amName", c.name); set("amNote", c.note); set("amProduct", c.name);
  set("amGrant", c.grant); set("amApprover", c.approver);
  set("amGrant2", c.grant); set("amApprover2", c.approver);
}
function closeAccessModal() {
  document.getElementById("accessModal").classList.remove("open");
}
function accessNext() { if (ACCESS_STEP < 3) { ACCESS_STEP++; renderAccessStep(); } }
function accessBack() { if (ACCESS_STEP > 1) { ACCESS_STEP--; renderAccessStep(); } }

function renderAccessStep() {
  const stepEls = document.querySelectorAll("#accessStepper .step");
  const lineEls = document.querySelectorAll("#accessStepper .line");
  stepEls.forEach((s, i) => {
    s.classList.toggle("active", (i+1) === ACCESS_STEP);
    s.classList.toggle("done", (i+1) < ACCESS_STEP);
  });
  lineEls.forEach((l, i) => l.classList.toggle("done", (i+1) < ACCESS_STEP));

  document.querySelectorAll(".access-pane").forEach(p => p.classList.add("hidden"));
  document.getElementById("access-pane-" + ACCESS_STEP).classList.remove("hidden");

  const back = document.getElementById("accessBackBtn");
  const next = document.getElementById("accessNextBtn");
  back.style.visibility = ACCESS_STEP === 1 ? "hidden" : "visible";
  if (ACCESS_STEP === 2) { next.textContent = "Submit request →"; }
  else if (ACCESS_STEP === 3) { next.classList.add("hidden"); back.classList.add("hidden"); }
  else { next.textContent = "Continue →"; next.classList.remove("hidden"); back.classList.remove("hidden"); }
}

/* ---------- Intake workflow ---------- */
let INTAKE_STEP = 1;
const INTAKE_LAST = 4;
function openIntake() { INTAKE_STEP = 1; document.getElementById("intakeModal").classList.add("open"); renderIntakeStep(); }
function closeIntake() { document.getElementById("intakeModal").classList.remove("open"); }
function intakeNext() { if (INTAKE_STEP < INTAKE_LAST + 1) { INTAKE_STEP++; renderIntakeStep(); } }
function intakeBack() { if (INTAKE_STEP > 1) { INTAKE_STEP--; renderIntakeStep(); } }
function renderIntakeStep() {
  document.querySelectorAll("#intakeStepper .step").forEach((s,i)=>{ s.classList.toggle("active",(i+1)===INTAKE_STEP); s.classList.toggle("done",(i+1)<INTAKE_STEP); });
  document.querySelectorAll("#intakeStepper .line").forEach((l,i)=> l.classList.toggle("done",(i+1)<INTAKE_STEP));
  document.querySelectorAll(".intake-pane").forEach(p=>p.classList.add("hidden"));
  const pane = document.getElementById("intake-pane-" + INTAKE_STEP);
  if (pane) pane.classList.remove("hidden");
  const back = document.getElementById("intakeBackBtn"), next = document.getElementById("intakeNextBtn");
  back.style.visibility = INTAKE_STEP === 1 ? "hidden" : "visible";
  if (INTAKE_STEP === INTAKE_LAST) { next.textContent = "Submit request →"; next.classList.remove("hidden"); back.classList.remove("hidden"); }
  else if (INTAKE_STEP === INTAKE_LAST + 1) { next.classList.add("hidden"); back.classList.add("hidden"); }
  else { next.textContent = "Continue →"; next.classList.remove("hidden"); back.classList.remove("hidden"); }
}

function __page_search(){
document.getElementById("app").innerHTML = "<div id=\"appbar\"></div>\n\n<div class=\"wrap\">\n  <div class=\"crumbs\"><a href=\"index.html\">Marketplace</a><span class=\"sep\">›</span><span id=\"crumbLast\">Search</span></div>\n\n  <div class=\"search-layout\">\n    <!-- FACETS (native marketplace filtering) -->\n    <aside class=\"facets\" id=\"facets\">\n      <div class=\"facet\"><h4>Asset type</h4><div id=\"f-type\"></div></div>\n      <div class=\"facet\"><h4>Domain</h4><div id=\"f-domain\"></div></div>\n      <div class=\"facet\">\n        <h4>Certification</h4>\n        <label><input type=\"checkbox\" class=\"f-cert\" value=\"Certified\"/> Certified <span class=\"cnt\" id=\"cnt-cert\"></span></label>\n        <label><input type=\"checkbox\" class=\"f-cert\" value=\"Candidate\"/> Candidate <span class=\"cnt\" id=\"cnt-cand\"></span></label>\n      </div>\n      <div class=\"facet\">\n        <h4>Status</h4>\n        <label><input type=\"checkbox\" class=\"f-status\" value=\"Certified\"/> Approved / Certified</label>\n        <label><input type=\"checkbox\" class=\"f-status\" value=\"Candidate\"/> Candidate</label>\n      </div>\n      <div class=\"facet\">\n        <h4>Rating</h4>\n        <label><input type=\"checkbox\" class=\"f-rating\" value=\"4.5\"/> 4.5★ &amp; up</label>\n        <label><input type=\"checkbox\" class=\"f-rating\" value=\"4\"/> 4★ &amp; up</label>\n        <label><input type=\"checkbox\" class=\"f-rating\" value=\"3\"/> 3★ &amp; up</label>\n      </div>\n      <div class=\"facet\">\n        <h4>Data quality</h4>\n        <label><input type=\"checkbox\" class=\"f-dq\" value=\"95\"/> 95%+ (Excellent)</label>\n        <label><input type=\"checkbox\" class=\"f-dq\" value=\"90\"/> 90%+ (Good)</label>\n      </div>\n      <div class=\"facet\">\n        <h4>Sensitivity</h4>\n        <label><input type=\"checkbox\" class=\"f-pii\" value=\"pii\"/> Contains PII</label>\n        <label><input type=\"checkbox\" class=\"f-pii\" value=\"nonpii\"/> Non-PII only</label>\n      </div>\n      <div class=\"facet\"><h4>Tags</h4><div id=\"f-tags\"></div></div>\n      <div class=\"facet\">\n        <button class=\"btn btn-ghost btn-sm btn-block\" onclick=\"clearFacets()\">Clear all filters</button>\n      </div>\n    </aside>\n\n    <!-- RESULTS -->\n    <div>\n      <form class=\"search-topbar\" onsubmit=\"return doSearch(event)\">\n        <input id=\"searchInput\" type=\"text\" placeholder=\"Search the catalog…\" style=\"padding-left:12px\"/>\n        <button class=\"btn btn-primary\" type=\"submit\">Search</button>\n      </form>\n\n      <div class=\"result-head\">\n        <div class=\"rcount\"><b id=\"resCount\">0</b> results <span id=\"forQuery\"></span></div>\n        <div class=\"sortbox\">Sort by\n          <select id=\"sortSel\" onchange=\"renderResults()\">\n            <option value=\"name\">Name (A–Z)</option>\n            <option value=\"rating\">Highest rated</option>\n            <option value=\"recent\">Recently updated</option>\n          </select>\n        </div>\n      </div>\n\n      <div id=\"results\"></div>\n    </div>\n  </div>\n</div>\n\n<div id=\"footer\"></div>";

  document.getElementById("appbar").innerHTML = renderAppBar("search");
  document.getElementById("footer").innerHTML = renderFooter();

  let QUERY = qp("q") || "";
  document.getElementById("searchInput").value = QUERY;

  // build dynamic facets from the catalog
  const count = (keyFn) => { const m={}; allProducts().forEach(p=>{const k=keyFn(p); if(k!=null) m[k]=(m[k]||0)+1;}); return m; };
  const typeCounts = count(p=>p.type), domainCounts = count(p=>p.domain);
  document.getElementById("f-type").innerHTML = Object.entries(typeCounts).map(([t,c])=>
    `<label><input type="checkbox" class="f-type" value="${t}"/> ${t} <span class="cnt">${c}</span></label>`).join("");
  document.getElementById("f-domain").innerHTML = Object.entries(domainCounts).map(([d,c])=>
    `<label><input type="checkbox" class="f-dom" value="${d}"/> ${d} <span class="cnt">${c}</span></label>`).join("");
  const tc={}; allProducts().forEach(p=>(p.tags||[]).forEach(t=>tc[t]=(tc[t]||0)+1));
  document.getElementById("f-tags").innerHTML = Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([t,c])=>
    `<label><input type="checkbox" class="f-tag" value="${t}"/> ${t} <span class="cnt">${c}</span></label>`).join("");
  document.getElementById("cnt-cert").textContent = allProducts().filter(p=>p.certified).length;
  document.getElementById("cnt-cand").textContent = allProducts().filter(p=>!p.certified).length;

  document.querySelectorAll(".facets input[type=checkbox]").forEach(cb => cb.addEventListener("change", renderResults));
  const PRETYPE = qp("type"); if (PRETYPE){ const cb=document.querySelector('.f-type[value="'+PRETYPE+'"]'); if(cb) cb.checked=true; }

  function doSearch(e){ e.preventDefault(); QUERY = document.getElementById("searchInput").value; renderResults(); return false; }
  function clearFacets(){ document.querySelectorAll(".facets input[type=checkbox]").forEach(cb=>cb.checked=false); renderResults(); }
  function getChecked(cls){ return [...document.querySelectorAll("."+cls+":checked")].map(c=>c.value); }

  // basic keyword match (native-style global search — no custom relevance layer)
  function matchQ(p, q){
    if (!q) return true;
    q = q.toLowerCase().trim();
    const hay = (p.name+" "+p.tagline+" "+(p.description||"")+" "+(p.tags||[]).join(" ")+" "+p.family+" "+p.domain).toLowerCase();
    return hay.includes(q);
  }
  function passFacets(p){
    const types = getChecked("f-type"); if (types.length && !types.includes(p.type)) return false;
    const doms = getChecked("f-dom"); if (doms.length && !doms.includes(p.domain)) return false;
    const status = p.certified?"Certified":"Candidate";
    const certs = getChecked("f-cert"); if (certs.length && !certs.includes(status)) return false;
    const sts = getChecked("f-status"); if (sts.length && !sts.includes(status)) return false;
    const ratings = getChecked("f-rating").map(Number); if (ratings.length && (p.rating||0) < Math.min(...ratings)) return false;
    const dqs = getChecked("f-dq").map(Number); if (dqs.length && (p.dqScore||0) < Math.min(...dqs)) return false;
    const piis = getChecked("f-pii");
    if (piis.length) { const want = (piis.includes("pii")&&p.pii) || (piis.includes("nonpii")&&!p.pii); if (!want) return false; }
    const tags = getChecked("f-tag"); if (tags.length && !tags.some(t=>(p.tags||[]).includes(t))) return false;
    return true;
  }

  function resultRow(p){
    const cert = p.certified ? `<span class="badge badge-certified">Certified</span>` : `<span class="badge badge-candidate">Candidate</span>`;
    const pii = p.pii ? `<span class="badge badge-pii">PII</span>` : `<span class="badge badge-green">Non-PII</span>`;
    const dqStatus = p.dqScore>=90?"fill-ok":"fill-warn";
    return `
    <a class="rrow" href="product.html?id=${p.id}">
      <div class="rbody">
        <div class="rtitle"><h3>${p.name}</h3> ${assetBadge(p.type)} ${cert} ${pii}</div>
        <div class="rdesc">${p.tagline}</div>
        <div class="rmeta">
          <span class="mi">${p.domain} › ${p.family}</span>
          <span class="mi">${starHTML(p.rating)} <b>${p.rating}</b> (${p.reviews})</span>
          <span class="mi">${p.consumers} consumers</span>
          <span class="mi">${p.latency}</span>
          <span class="mi" title="Data quality score">DQ <div class="bar" style="width:60px;display:inline-block;vertical-align:middle"><span class="${dqStatus}" style="width:${p.dqScore}%"></span></div> ${p.dqScore}%</span>
        </div>
        <div class="rtags">${(p.tags||[]).slice(0,5).map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      </div>
    </a>`;
  }

  function renderResults(){
    let list = allProducts().filter(p => matchQ(p, QUERY) && passFacets(p));
    const sort = document.getElementById("sortSel").value;
    list.sort((a,b)=>{
      if (sort==="rating") return b.rating-a.rating;
      if (sort==="recent") return (b.updated||"").localeCompare(a.updated||"");
      return a.name.localeCompare(b.name);
    });
    document.getElementById("resCount").textContent = list.length;
    document.getElementById("forQuery").innerHTML = QUERY ? `for “<b>${QUERY}</b>”` : "";
    document.getElementById("crumbLast").textContent = QUERY ? `Search: ${QUERY}` : "Search";
    const el = document.getElementById("results");
    if (!list.length) { el.innerHTML = `<div class="empty-state card"><h3>No matching data assets</h3><p>Try a different keyword or clear some filters, or <a href="domains.html">browse by domain</a>.</p></div>`; return; }
    el.innerHTML = list.map(resultRow).join("");
  }

  renderResults();

try{window.doSearch=doSearch;}catch(_){}try{window.renderResults=renderResults;}catch(_){}try{window.clearFacets=clearFacets;}catch(_){}
}

ge &amp; emergency communications</option>\n            <option>Billing / account servicing</option>\n            <option>Regulatory reporting</option>\n            <option>Analytics / data science</option>\n          </select>\n        </div>\n        <div class=\"field\">\n          <label>Access duration</label>\n          <select><option>12 months (standard)</option><option>6 months</option><option>90 days (temporary)</option></select>\n        </div>\n      </div>\n\n      <!-- Step 2 -->\n      <div class=\"access-pane hidden\" id=\"access-pane-2\">\n        <div class=\"callout callout-warn mb-16\"><div>By requesting access you agree to Exelon's <b>Data Handling &amp; Privacy Policy</b>. PII must not be exported, shared externally, or used for any purpose outside the one stated.</div></div>\n        <div class=\"kv card\" style=\"padding:6px 16px; margin-bottom:16px;\">\n          <div class=\"row\"><span class=\"k\">Requester</span><span class=\"v\">Hailey Banask · Customer Analytics</span></div>\n          <div class=\"row\"><span class=\"k\">Asset</span><span class=\"v\" id=\"amProduct\">Customer Profile</span></div>\n          <div class=\"row\"><span class=\"k\">Grant target</span><span class=\"v\" id=\"amGrant\">Databricks group <code>cust_360_readers</code></span></div>\n          <div class=\"row\"><span class=\"k\">Approver</span><span class=\"v\" id=\"amApprover\">Maria Chen (Data Product Owner)</span></div>\n          <div class=\"row\"><span class=\"k\">SLA to decision</span><span class=\"v\">2 business days</span></div>\n        </div>\n        <label class=\"toggle-pii mb-8\"><input type=\"checkbox\" checked/> I hold an active Data Handling (PII) certification.</label>\n        <label class=\"toggle-pii\"><input type=\"checkbox\" checked/> I agree to the Data Handling &amp; Privacy Policy and acceptable-use terms.</label>\n      </div>\n\n      <!-- Step 3 -->\n      <div class=\"access-pane hidden\" id=\"access-pane-3\">\n        <div style=\"text-align:center; padding:18px 0;\">\n          <div style=\"font-size:54px;\">✅</div>\n          <h3 style=\"margin:8px 0;\">Request submitted</h3>\n          <p class=\"muted\" style=\"max-width:440px;margin:0 auto 18px;\">Request <b>REQ-204871</b> has been routed to <b id=\"amApprover2\">Maria Chen</b> for approval. You'll be notified and provisioned automatically (<span id=\"amGrant2\">cust_360_readers</span>) once approved.</p>\n          <div class=\"callout callout-ok\" style=\"text-align:left;\"><div>Meanwhile, you can preview the product's documentation, sample data, and lineage on this page. The direct Databricks link will activate the moment access is granted.</div></div>\n        </div>\n      </div>\n    </div>\n    <div class=\"modal-foot\">\n      <button class=\"btn btn-ghost\" id=\"accessBackBtn\" onclick=\"accessBack()\">← Back</button>\n      <button class=\"btn btn-primary\" id=\"accessNextBtn\" onclick=\"accessAdvance()\">Continue →</button>\n    </div>\n  </div>\n</div>";

  document.getElementById("appbar").innerHTML = renderAppBar("");
  document.getElementById("footer").innerHTML = renderFooter();

  const P = getProduct(qp("id")) || getProduct("customer-profile");
  document.getElementById("amName").textContent = P.name;

  function accessAdvance(){ if (ACCESS_STEP===1) accessNext(); else if (ACCESS_STEP===2) accessNext(); }

  /* ---------- helpers ---------- */
  const dqClass = v => v>=95?"fill-ok":v>=85?"fill-ok":v>=70?"fill-warn":"fill-bad";
  const cls = c => {
    const m = {Public:"badge-green",Internal:"badge-neutral",Confidential:"badge-info",Restricted:"badge-pii"};
    return `<span class="badge ${m[c]||'badge-neutral'}">${c}</span>`;
  };
  const stBadge = s => s==="pass" ? '<span class="badge badge-certified">✔ Passing</span>'
                     : s==="warn" ? '<span class="badge badge-candidate">⚠ Needs attention</span>'
                     : '<span class="badge badge-pii">✕ Failing</span>';
  const fillByStatus = { pass:"fill-ok", warn:"fill-warn", fail:"fill-bad" };

  /* ---------- build the page ---------- */
  const certBadge = P.certified
    ? `<span class="badge badge-certified">Certified</span>`
    : `<span class="badge badge-candidate">Candidate</span>`;
  const piiBadge = P.pii ? `<span class="badge badge-pii">PII</span>` : `<span class="badge badge-green">Non-PII</span>`;

  const hasFull = !!(P.columns && P.columns.length);

  // tabs available depending on richness
  const tabs = [
    {id:"overview", label:"Overview", icon:"📄"},
    ...(hasFull?[{id:"schema", label:"Columns", icon:"🧱", count:P.columns.length}]:[]),
    {id:"quality", label:"Data Quality", icon:"✓"},
    ...(P.lineage?[{id:"diagram", label:"Diagram"}]:[]),
    ...(P.sample?[{id:"sample", label:"Sample Data", icon:"🔎"}]:[]),
    ...(P.owner?[{id:"people", label:"Responsibilities", icon:"👤"}]:[]),
    ...(P.reviewsList?[{id:"reviews", label:"Reviews", icon:"⭐", count:P.reviews}]:[])
  ];

  /* ----- OVERVIEW panel ----- */
  const overviewHTML = `
    <div class="section-card">
      <h3>About this data product</h3>
      <p class="lead-desc">${P.description || P.tagline}</p>
    </div>
    ${P.businessContext?`
    <div class="section-card">
      <h3>Business context</h3>
      <p class="lead-desc">${P.businessContext}</p>
    </div>`:""}
    ${(P.useCasesIntended && P.useCasesNotIntended)?`
    <div class="section-card">
      <h3>Use cases — what this data is &amp; isn't for</h3>
      <div class="usecase-grid">
        <div class="uc good"><h4>Intended uses</h4><ul>${P.useCasesIntended.map(u=>`<li>${u}</li>`).join("")}</ul></div>
        <div class="uc bad"><h4>Not intended for</h4><ul>${P.useCasesNotIntended.map(u=>`<li>${u}</li>`).join("")}</ul></div>
      </div>
    </div>`:""}
    ${(P.terms)?`
    <div class="section-card">
      <h3>Business terms &amp; definitions</h3>
      ${P.terms.map(t=>`<div class="term-row"><div class="tname">${t.term}</div><div class="tdef">${t.def}</div></div>`).join("")}
    </div>`:""}
    <div class="section-card">
      <h3>Tags</h3>
      <div class="flex gap-8 wrap-flex">${(P.tags||[]).map(t=>`<a class="pill" href="search.html?q=${encodeURIComponent(t)}">${t}</a>`).join("")}</div>
    </div>`;

  /* ----- SCHEMA / COLUMNS panel ----- */
  const schemaHTML = hasFull?`
    <div class="section-card">
      <h3>Columns <span class="badge badge-neutral">${P.columns.length} fields</span></h3>
      <div class="col-filter">
        <input id="colSearch" placeholder="Filter columns by business or technical name…" oninput="filterCols()"/>
        <label class="toggle-pii"><input type="checkbox" id="piiOnly" onchange="filterCols()"/> Show PII fields only</label>
        <span class="muted small" style="margin-left:auto">Search uses <b>business names</b>, not just table names.</span>
      </div>
      <div class="sample-wrap">
        <table class="tbl" id="colTable">
          <thead><tr>
            <th>Business name</th><th>Technical name</th><th>Type</th><th>Sensitivity</th><th>PII</th><th>Field quality</th><th>Description</th>
          </tr></thead>
          <tbody>
          ${P.columns.map(c=>`
            <tr data-name="${(c.business+' '+c.name+' '+(c.desc||'')).toLowerCase()}" data-pii="${c.pii}">
              <td class="colname">${c.business} ${c.key?`<span class="badge badge-info" style="margin-left:4px">${c.key}</span>`:""}</td>
              <td><code>${c.name}</code></td>
              <td><span class="mono">${c.type}</span></td>
              <td>${cls(c.cls)}</td>
              <td>${c.pii?'<span class="badge badge-pii">PII</span>':'<span class="muted">—</span>'}</td>
              <td><div class="dqcell"><div class="bar"><span class="${dqClass(c.dq)}" style="width:${c.dq}%"></span></div><b>${c.dq}%</b></div></td>
              <td class="muted">${c.desc||""}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>`:"";

  /* ----- DATA QUALITY panel ----- */
  const qualityHTML = `
    <div class="section-card">
      <h3>Data quality ${P.dqRules?`<span class="badge badge-certified" style="margin-left:auto">${P.dqRulesPassing}/${P.dqRules} rules passing</span>`:""}</h3>
      <div class="dq-top">
        <div class="score-ring" style="--val:${P.dqScore}; --col:${P.dqScore>=95?'var(--ok)':P.dqScore>=85?'var(--exelon-green)':'var(--warn)'}">
          <div class="score-val"><b>${P.dqScore}%</b><small>Overall</small></div>
        </div>
        <div class="dq-dims">
          ${(P.dqDims||[]).map(d=>`
            <div class="dq-dim">
              <div class="dname">${d.dim}<span class="dnote">${d.note}</span></div>
              <div class="bar"><span class="${dqClass(d.score)}" style="width:${d.score}%"></span></div>
              <div class="dval">${d.score}%</div>
            </div>`).join("") || '<p class="muted">Dimension-level scores are configured via the Collibra Data Quality integration.</p>'}
        </div>
      </div>
      <div class="callout callout-ok mt-16"><div>Quality is monitored continuously by <b>Collibra Data Quality &amp; Observability</b>. Rules run on every daily load; owners are alerted on failures and consumers see the live score above.</div></div>
    </div>
    ${P.dqRulesList?`
    <div class="section-card">
      <h3>Quality rules
        <span class="badge badge-neutral">${P.dqRulesList.length} tracked</span>
        <span class="badge badge-certified" style="margin-left:auto">${P.dqRulesList.filter(r=>r.status==="pass").length}/${P.dqRulesList.length} passing</span>
      </h3>
      <p class="muted" style="margin-top:-6px">Individual rules monitored for this data product. Each runs on the daily load; consumer-friendly names are shown with the underlying technical rule.</p>
      <div class="sample-wrap">
        <table class="tbl">
          <thead><tr>
            <th>Rule</th><th>Dimension</th><th>Status</th><th>Pass rate</th><th>Technical rule</th><th>Last run</th>
          </tr></thead>
          <tbody>
          ${P.dqRulesList.map(r=>`
            <tr>
              <td class="colname">${r.name}<span style="display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px">${r.desc||""}</span></td>
              <td><span class="badge badge-neutral">${r.dim}</span></td>
              <td>${stBadge(r.status)}</td>
              <td><div class="dqcell"><div class="bar"><span class="${fillByStatus[r.status]||'fill-ok'}" style="width:${r.rate}%"></span></div><b>${r.rate}%</b></div></td>
              <td><code>${r.tech}</code></td>
              <td class="muted" style="white-space:nowrap">${r.lastRun}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
      <div class="callout callout-warn mt-16"><div><b>2 rules need attention.</b> Completeness gaps on <b>Product Subcategory</b> and <b>Customer Churn Status</b> are being remediated with the source system; records are still usable, but treat those two fields with care until resolved.</div></div>
    </div>`:""}`;

  /* ----- LINEAGE panel ----- */
  // Collibra-style object-type registry (abbreviation + color)
  const LINTYPE = {
    "Data Product": {abbr:"DP",  color:"#7b2ff2"},
    "Data Domain":  {abbr:"DOM", color:"#2f6fe0"},
    "Data Entity":  {abbr:"ENT", color:"#df8470"},
    "Schema":       {abbr:"SCH", color:"#e0a52c"},
    "Database":     {abbr:"DB",  color:"#e8533f"},
    "System":       {abbr:"SYS", color:"#4ba8d8"},
    "Business Term":{abbr:"TRM", color:"#0e9aa7"},
    "Column":       {abbr:"COL", color:"#8aa0b5"},
    "Source System":{abbr:"SYS", color:"#4ba8d8"},
    "Process":      {abbr:"PRC", color:"#16a8c9"},
    "Enrichment":   {abbr:"ENR", color:"#2faa6a"},
    "Report":       {abbr:"RPT", color:"#5a6fd6"},
    "Application":  {abbr:"APP", color:"#6b7c8d"}
  };
  const dqChip = v => v==null ? "" : `<span class="badge ${v>=95?'badge-certified':v>=85?'badge-green':'badge-candidate'}" style="font-size:10px;padding:2px 7px">DQ ${v}%</span>`;
  const linNode = (n, self) => {
    const tname = self ? "Data Product" : n.type;
    const ty = LINTYPE[tname] || LINTYPE["Data Entity"];
    const tip = (n.desc||n.name).replace(/"/g,"&quot;");
    const title = n.id ? `<a href="product.html?id=${n.id}">${n.name}</a>` : `<b>${n.name}</b>`;
    const bl = self ? "" : `border-left:4px solid ${ty.color};`;
    return `<div class="lin-node ${self?'self':''}" style="${bl}" data-tip="${tip}">
      <div class="ln-top">${title}</div>
      <div class="ln-meta"><span class="lin-type" style="background:${ty.color}">${ty.abbr}</span><span class="lt">${tname}</span>${dqChip(self?P.dqScore:n.dq)}</div>
    </div>`;
  };
  const businessHTML = P.lineage ? `
    <div class="lin-flow">
      <div class="lin-col"><span class="col-lbl">⬅ Upstream sources</span>${P.lineage.upstream.map(n=>linNode(n)).join("")}</div>
      <span class="lin-arrow">→</span>
      <div class="lin-col"><span class="col-lbl">This product</span>${linNode({name:P.lineage.self,type:'Data Product',desc:P.tagline}, true)}</div>
      <span class="lin-arrow">→</span>
      <div class="lin-col"><span class="col-lbl">➡ Downstream consumers</span>${P.lineage.downstream.map(n=>linNode(n)).join("")}</div>
    </div>` : "";
  const techNode = (node) => {
    if (node.cols) {
      const ty = LINTYPE[node.type] || LINTYPE["Data Entity"];
      return `<div class="tech-table">
        <div class="tech-th" data-anchor="${node.id}" style="background:${ty.color}" data-tip="${(node.tip||node.id).replace(/"/g,'&quot;')}">
          <span class="tch">${ty.abbr}</span><span class="tt-name">${node.id}</span>${node.schema?`<span class="tch" style="background:${LINTYPE.Schema.color}">${node.schema}</span>`:""}
        </div>
        ${node.cols.map(c=>{
          const dqv = node.dq && node.dq[c]!=null ? node.dq[c] : null;
          const dqcls = dqv==null?"":(dqv>=95?"ok":dqv>=85?"mid":"low");
          return `<div class="tech-row" data-anchor="${node.id}::${c}">${c}${dqv!=null?`<span class="tech-dq ${dqcls}">${dqv}%</span>`:""}</div>`;
        }).join("")}
      </div>`;
    }
    const ty = LINTYPE[node.type] || LINTYPE["System"];
    return `<div class="tech-node" data-anchor="${node.id}" style="background:${ty.color}" data-tip="${(node.tip||node.label).replace(/"/g,'&quot;')}"><span class="tch">${ty.abbr}</span><span>${node.label}</span></div>`;
  };
  const techHTML = P.techLineage?`
    <div id="techDiagram" class="techlin">
      <div id="techInner" class="tech-inner">
        <svg id="techSvg" class="tech-svg"></svg>
        <div class="tech-stages">
          ${P.techLineage.stages.map(st=>`
            <div class="tech-col">
              <div class="tech-collbl">${st.label}${st.db?`<span class="lin-type" style="background:${LINTYPE.Database.color};margin-left:6px">DB ${st.db}</span>`:""}</div>
              ${st.nodes.map(techNode).join("")}
            </div>`).join("")}
        </div>
      </div>
    </div>`:`<div class="callout callout-info"><div>Technical lineage is harvested into Collibra for this product.</div></div>`;
  const TYPEDESC = {
    "Data Product":"A governed, reusable, business-ready data asset, owned with clear accountability and delivered with defined quality, access, and lifecycle standards.",
    "Data Domain":"A business grouping of related data (e.g., Customer & Service Mgmt.) used to organize data and assign ownership.",
    "Data Entity":"A dataset / table that physically holds data as rows and columns. In the catalog, 'dataset' and 'data entity' are the same asset.",
    "Column":"An individual field / attribute within a data entity.",
    "Schema":"A logical grouping of tables within a database.",
    "Database":"A physical database that stores schemas and tables (e.g., the Bronze, Foundation or Gold layer).",
    "System":"The source or hosting platform where data originates or lives (e.g., SAP CR&B, Oracle CC&B).",
    "Business Term":"A glossary definition that gives business meaning to data and is linked to the columns / entities that implement it.",
    "Source System":"The source or hosting platform where data originates (e.g., SAP CR&B, Oracle CC&B).",
    "Process":"A transformation or job that moves and reshapes data between assets.",
    "Enrichment":"A step that validates, standardizes or augments data (e.g., address validation).",
    "Report":"A report or dashboard that consumes the data.",
    "Application":"An operational application that consumes the data."
  };
  const LT = (typeName, label) => { const t=LINTYPE[typeName]; const tip=("<b>"+(label||typeName)+"</b><br>"+(TYPEDESC[typeName]||"")).replace(/"/g,"&quot;"); return `<span class="ll" data-tip="${tip}"><span class="lin-type" style="background:${t.color}">${t.abbr}</span> ${label||typeName}</span>`; };
  const legendBusiness = `<div class="lin-legend" id="legend-business"><span class="ll-title">Legend</span>${LT("Source System","Source system")}${LT("Process")}${LT("Enrichment")}${LT("Data Product")}${LT("Report")}${LT("Application")}<span class="ll muted">Hover a type for its definition</span></div>`;
  const legendTechnical = `<div class="lin-legend hidden" id="legend-technical"><span class="ll-title">Legend</span>${LT("Database")}${LT("Schema")}${LT("Data Entity")}${LT("Column")}<span class="ll muted">Hover a type for its definition</span></div>`;
  const legendCatalog = `<div class="lin-legend hidden" id="legend-catalog"><span class="ll-title">Legend</span>${LT("System")}${LT("Database")}${LT("Schema")}${LT("Data Entity")}${LT("Column")}${LT("Business Term")}${LT("Data Domain")}${LT("Data Product")}<span class="ll muted">Hover a type for its definition</span></div>`;
  const catTypeBox = (node) => {
    const ty = LINTYPE[node.type] || LINTYPE["Data Entity"];
    if(node.cols){
      return `<div class="tech-table">
        <div class="tech-th" data-anchor="${node.id}" style="background:${ty.color}" data-tip="${(node.tip||node.label).replace(/"/g,'&quot;')}"><span class="tch">${ty.abbr}</span><span class="tt-name">${node.label}</span></div>
        ${node.cols.map(c=>`<div class="tech-row" data-anchor="${node.id}::${c}">${c}</div>`).join("")}
      </div>`;
    }
    return `<div class="tech-node" data-anchor="${node.id}" style="background:${ty.color}" data-tip="${(node.tip||node.label).replace(/"/g,'&quot;')}"><span class="tch">${ty.abbr}</span><span>${node.label}</span></div>`;
  };
  const catDb = (db) => `<div class="cat-db" data-anchor="${db.id}" data-tip="${('Database — '+(db.tip||db.label)).replace(/"/g,'&quot;')}">
    <div class="cat-db-head" style="background:${LINTYPE.Database.color}"><span class="tch">DB</span> ${db.label}</div>
    ${db.layer?`<div class="cat-db-layer">${db.layer}</div>`:""}
    <div class="cat-db-body">${db.schemas.map(s=>`<div class="cat-schema" data-anchor="${s.id}" style="background:${LINTYPE.Schema.color}" data-tip="${('Schema — '+(s.tip||s.label)).replace(/"/g,'&quot;')}"><span class="tch">SCH</span> ${s.label}</div>`).join("")}</div>
  </div>`;
  const catalogHTML = P.catalogLineage?`
    <div id="catDiagram" class="techlin">
      <div id="catInner" class="tech-inner">
        <svg id="catSvg" class="tech-svg"></svg>
        <div class="tech-stages">
          ${P.catalogLineage.stages.map(st=>`
            <div class="tech-col">
              <div class="tech-collbl">${st.label}</div>
              ${st.databases ? st.databases.map(catDb).join("") : st.nodes.map(catTypeBox).join("")}
            </div>`).join("")}
        </div>
      </div>
    </div>`:`<div class="callout callout-info"><div>Data catalog lineage is available in Collibra for this product.</div></div>`;
  const legendBoxHTML = `<div class="dgm-legend"><div class="dgl-h">Legend</div>${["Data Product","Data Domain","Data Entity","Schema","Database","System","Business Term","Column","Source System","Process","Enrichment","Report"].map(t=>LT(t)).join("")}</div>`;
  const diagramHTML = P.lineage?`
    <div class="section-card" id="lineageRoot" style="padding:0;overflow:hidden">
      <div class="dgm-toolbar">
        <select id="dgmType" onchange="linView(this.value)">
          <option value="business">Business lineage</option>
          <option value="technical">Technical lineage</option>
          <option value="catalog">Data catalog lineage</option>
        </select>
        <select class="dgm-ctrl"><option>Flow / Context</option></select>
        <select class="dgm-ctrl"><option>End-to-end</option></select>
        <span class="dgm-chip">Depth&nbsp;50</span>
        <span class="dgm-zoom">&minus;&nbsp;&nbsp;+&nbsp;&nbsp;Fit</span>
      </div>
      <div class="dgm-body">
        <div class="dgm-canvas">
          <div id="lin-business">${businessHTML}</div>
          <div id="lin-technical" class="hidden">${techHTML}</div>
          <div id="lin-catalog" class="hidden">${catalogHTML}</div>
        </div>
        ${legendBoxHTML}
      </div>
    </div>`:"";

  /* ----- SAMPLE panel ----- */
  const sampleHTML = P.sample?`
    <div class="section-card">
      <h3>Sample data <span class="badge badge-pii" style="margin-left:8px">PII masked</span></h3>
      <div class="callout callout-warn mb-16"><div>${P.sample.note}</div></div>
      <div class="sample-wrap">
        <table class="tbl">
          <thead><tr>${P.sample.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead>
          <tbody>${P.sample.rows.map(r=>`<tr>${r.map(v=>`<td class="${String(v).includes('masked')||String(v).includes('*')?'muted':''}">${v}</td>`).join("")}</tr>`).join("")}</tbody>
        </table>
      </div>
    </div>`:"";

  /* ----- RELATED panel ----- */
  const relatedHTML = `

    const catLinks  = (P.catalogLineage && P.catalogLineage.links) || [];
    const allLinks  = [...techLinks, ...catLinks];

    const FRIENDLY = {
      "GOLD.CUSTOMER_PROFILE::ACCOUNT_ID":"Enterprise billing account identifier",
      "GOLD.CUSTOMER_PROFILE::CUSTOMER_ID":"Mastered customer identifier",
      "GOLD.CUSTOMER_PROFILE::PRIMARY_EMAIL_ADDRESS":"Primary contact email",

    };
    const pretty = s => s.toLowerCase().replace(/_/g," ").replace(/\b\w/g, m=>m.toUpperCase());

    // precompute column tooltips (from/to mappings, across both views)
    root.querySelectorAll(".tech-row[data-anchor]").forEach(row=>{

      if(froms.length) t += "<br>⬅ sourced from "+[...new Set(froms)].join(", ");
      if(tos.length)   t += "<br>➡ feeds "+[...new Set(tos)].join(", ");
      row.setAttribute("data-tip", t);
    });

    // floating tooltip (one per document)
    let tip = document.getElementById("linTip");
    if(!tip){ tip = document.createElement("div"); tip.id="linTip"; tip.className="lin-tip"; document.body.appendChild(tip); }
    function moveTip(x,y){ const pad=14,w=tip.offsetWidth,h=tip.offsetHeight; let tx=x+pad,ty=y+pad;
      if(tx+w>window.innerWidth-8) tx=x-w-pad; if(ty+h>window.innerHeight-8) ty=y-h-pad; tip.style.left=tx+"px"; tip.style.top=ty+"px"; }
    root.addEventListener("mousemove", e=>{ const t=e.target.closest("[data-tip]");
      if(t){ tip.innerHTML=t.getAttribute("data-tip"); tip.style.display="block"; moveTip(e.clientX,e.clientY); } else tip.style.display="none"; });
    root.addEventListener("mouseleave", ()=>{ tip.style.display="none"; });

    // draw connectors for a given view
    function drawLinks(svgId, innerId, linksArr){
      const svg=document.getElementById(svgId), inner=document.getElementById(innerId);
      if(!svg||!inner) return;
      const W=inner.scrollWidth, H=inner.scrollHeight;
      svg.setAttribute("width",W); svg.setAttribute("height",H); svg.setAttribute("viewBox","0 0 "+W+" "+H);
      const o=inner.getBoundingClientRect();
      let paths="";
      linksArr.forEach(lk=>{
        const a=inner.querySelector('[data-anchor="'+lk[0]+'"]'), b=inner.querySelector('[data-anchor="'+lk[1]+'"]');
        if(!a||!b) return;
        const ar=a.getBoundingClientRect(), br=b.getBoundingClientRect();
        const x1=ar.right-o.left, y1=ar.top-o.top+ar.height/2, x2=br.left-o.left, y2=br.top-o.top+br.height/2;
        const dx=Math.max(46,(x2-x1)/2);
        paths+='<path class="tech-link" data-from="'+lk[0]+'" data-to="'+lk[1]+'" d="M'+x1+','+y1+' C'+(x1+dx)+','+y1+' '+(x2-dx)+','+y2+' '+x2+','+y2+'"/>';
      });
      svg.innerHTML=paths;
    }
    function drawActive(){
      const t=document.getElementById("lin-technical"), c=document.getElementById("lin-catalog");
      if(t && !t.classList.contains("hidden")) drawLinks("techSvg","techInner",techLinks);
      if(c && !c.classList.contains("hidden")) drawLinks("catSvg","catInner",catLinks);
    }
    window.__drawActive = drawActive;

    window.linView = function(v){
      [["business","lin-business"],["technical","lin-technical"],["catalog","lin-catalog"]].forEach(([name,viewId])=>{
        const ve=document.getElementById(viewId); if(ve) ve.classList.toggle("hidden", name!==v);
      });
      if(v==="technical"||v==="catalog") requestAnimationFrame(()=>requestAnimationFrame(drawActive));
    };

    // highlight connected paths when hovering a node/column
    root.addEventListener("mouseover", e=>{ const c=e.target.closest("[data-anchor]"); if(!c) return; const a=c.getAttribute("data-anchor");
      root.querySelectorAll("svg.tech-svg path").forEach(p=>{ const on=p.getAttribute("data-from")===a||p.getAttribute("data-to")===a;
        p.classList.toggle("active",on); p.classList.toggle("dim",!on); }); });
    root.addEventListener("mouseout", e=>{ if(!e.target.closest("[data-anchor]")) return;
      root.querySelectorAll("svg.tech-svg path").forEach(p=>{ p.classList.remove("active"); p.classList.remove("dim"); }); });

    // redraw on resize (single listener)
    if(window.__linResize) window.removeEventListener("resize", window.__linResize);
    window.__linResize = drawActive;
    window.addEventListener("resize", window.__linResize);
  })();

      grant:(P.reportTool||"Power BI")+" workspace · OpCo-scoped role", approver:((P.owner&&P.owner.name)||"Report Owner")+" (Report Owner)" };
    if (P.type==="API") return { name:P.name,
      note:"API access is granted to your application's service account and is governed by <b>operating-company data segregation</b> (e.g., BGE clients cannot retrieve PHI records). Manager approval required.",
      grant:"API client credentials · OpCo-scoped", approver:((P.owner&&P.owner.name)||"API Owner")+" (API Owner)" };
    return { name:P.name,
      note: P.pii ? "This is a <b>Confidential / PII</b> product. Access requires manager approval and an active Data Handling (PII) certification. Grants are <b>OpCo-scoped</b> (e.g., BGE users cannot view PHI data)."
                  : "Access requires manager approval. Grants are <b>OpCo-scoped</b> — e.g., BGE users cannot view PHI data.",
      grant: P.databricksPath ? ("Databricks group · <code>"+(P.id==="customer-profile"?"cust_360_readers":(P.id.replace(/-/g,'_')+"_readers"))+"</code>") : "Databricks group",
      approver: ((P.owner&&P.owner.name)||"Data Product Owner")+(P.owner?(" ("+P.owner.role+")"):"") };
  })();
  function requestAccess(){ openAccessModal(ACCESS_CTX); }
  function notifyLaunch(e){ if(e&&e.preventDefault) e.preventDefault(); requestAccess(); return false; }
  window.toggleFollow = toggleFollow; window.notifyLocked = notifyLocked; window.notifyLaunch = notifyLaunch; window.requestAccess = requestAccess;

  function filterCols(){
    const q = (document.getElementById("colSearch").value||"").toLowerCase();
    const piiOnly = document.getElementById("piiOnly").checked;
    document.querySelectorAll("#colTable tbody tr").forEach(tr=>{
      const matchQ = tr.dataset.name.includes(q);
      const matchPii = !piiOnly || tr.dataset.pii==="true";
      tr.style.display = (matchQ && matchPii)?"":"none";
    });
  }
  window.filterCols = filterCols;

try{window.accessAdvance=accessAdvance;}catch(_){}

function __page_domains(){
document.getElementById("app").innerHTML = "<div id=\"appbar\"></div>\n\n<section class=\"dom-hero\">\n  <div class=\"wrap\">\n    <h1>🗂 Browse by domain</h1>\n    <p>Navigate the marketplace the way Exelon's business is organized — across <b>Operations</b>, <b>Customer</b>, and <b>Corporate Functions</b>. Pick a domain &amp; family to find the data products mastered there.</p>\n  </div>\n</section>\n\n<div class=\"wrap\">\n  <div class=\"legend\">\n    <span><span class=\"sw\" style=\"background:var(--info-bg);border:1px solid var(--exelon-blue)\"></span> Published data product (click to open)</span>\n    <span><span class=\"sw\" style=\"background:#fff;border:1px solid var(--line)\"></span> Data asset / candidate (click to search)</span>\n    <span><span class=\"sw\" style=\"background:var(--exelon-green)\"></span> Highlighted family</span>\n  </div>\n\n  <div class=\"dom-columns\" id=\"domColumns\"></div>\n</div>\n\n<div id=\"footer\"></div>";

  document.getElementById("appbar").innerHTML = renderAppBar("domains");
  document.getElementById("footer").innerHTML = renderFooter();

  // Map item names -> product ids for items that are real products
  const ITEM_TO_PRODUCT = {};
  allProducts().forEach(p => { ITEM_TO_PRODUCT[p.name.toLowerCase()] = p.id; });
  // (MVP) Only the Customer Profile data product is published; it auto-maps above.
  // Other domain items are not yet onboarded and resolve via catalog search.

  function itemLink(name){
    const pid = ITEM_TO_PRODUCT[name.toLowerCase()];
    if (pid) return `<a class="product" href="product.html?id=${pid}">${name}</a>`;
    return `<a href="search.html?q=${encodeURIComponent(name)}">${name}</a>`;
  }

  document.getElementById("domColumns").innerHTML = EXELON_DOMAINS.map(d => {
    const itemCount = d.families.reduce((n,f)=>n+f.items.length,0);
    return `
    <div class="dom-group" data-domain="${d.name}" id="dom-${encodeURIComponent(d.name)}">
      <div class="gh" style="background:linear-gradient(120deg, ${d.color}, var(--exelon-navy))">
        <span class="gi">${d.icon}</span><h2>${d.name}</h2>
        <span class="gc">${itemCount} assets</span>
      </div>
      <div class="gbody">
        ${d.families.map(f=>`
          <div class="fam ${f.highlight?'hl':''}">
            <h3>${f.name} ${f.highlight?'<span class="ftag">Featured</span>':''}</h3>
            <div class="items">${f.items.map(itemLink).join("")}</div>
          </div>`).join("")}
      </div>
    </div>`;
  }).join("");

  // deep-link scroll
  if (location.hash) {
    const el=(function(){var dd=qp('d');return dd?Array.prototype.slice.call(document.querySelectorAll('.dom-group')).filter(function(g){return g.getAttribute('data-domain')===dd;})[0]:null;})();
    if (el) setTimeout(()=>el.scrollIntoView({behavior:"smooth", block:"start"}), 100);
  }


}

/* ============ single-file SPA router ============ */
let ROUTE_QUERY = new URLSearchParams();
window.qp = function(n){ return ROUTE_QUERY.get(n); };
window.goSearch = function(e,q,scope){ if(e&&e.preventDefault)e.preventDefault(); location.hash = buildSearchUrl(q,scope); return false; };

function __route(){
  window.scrollTo(0,0);
  let h = location.hash.slice(1);
  if(!h) h = "index.html";
  let path=h, qs="";
  const qi=h.indexOf('?'); if(qi>=0){ path=h.slice(0,qi); qs=h.slice(qi+1); }
  const hi=path.indexOf('#'); if(hi>=0) path=path.slice(0,hi);
  ROUTE_QUERY = new URLSearchParams(qs);
  try {
    if(path.indexOf('search')===0) __page_search();
    else if(path.indexOf('product')===0) __page_product();
    else if(path.indexOf('domains')===0) __page_domains();
    else __page_home();
  } catch(err){ console.error('route error', err); }
}
window.addEventListener('hashchange', __route);

/* intercept in-app navigation links */
document.addEventListener('click', function(e){
  const a = e.target.closest && e.target.closest('a');
  if(!a) return;
  const href = a.getAttribute('href');
  if(!href) return;
  if(href === '#'){ e.preventDefault(); return; }
  if(/^(index|search|product|domains)\.html/.test(href)){
    e.preventDefault();
    const route = href.replace(/^(domains\.html)#(.*)$/, '$1?d=$2');
    if(location.hash === '#'+route){ __route(); } else { location.hash = route; }
  }
});

__route();
